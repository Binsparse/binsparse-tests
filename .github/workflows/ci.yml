name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Binsparse/binsparse-reference-python
          path: reference
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov pytest-xdist -e ".[hdf5,zarr]"
      - name: Run tests
        env:
          BINSPARSE_TO_BINSPARSE: python "${{ github.workspace }}/reference/bin/binsparse_to_binsparse"
          BINSPARSE_TO_NPY: python "${{ github.workspace }}/reference/bin/binsparse_to_npy"
          NPY_TO_BINSPARSE: python "${{ github.workspace }}/reference/bin/npy_to_binsparse"
          PYTHONPATH: ${{ github.workspace }}/reference/src
        run: python -m pytest -n auto

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and mypy
        run: python -m pip install --upgrade pip mypy -e .
      - name: Run mypy
        run: python -m mypy

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
